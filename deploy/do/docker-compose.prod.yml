# Production stack for a single DigitalOcean droplet.
#
# App images are PULLED from Docker Hub by immutable tag (${IMAGE_TAG}); backing
# services run alongside them. Only Caddy publishes ports (80/443) — everything
# else is reachable only on the internal compose network.
#
# Driven by deploy.sh, which exports REGISTRY / DOCKERHUB_USERNAME / IMAGE_PREFIX /
# IMAGE_TAG and loads secrets from .env.production (never committed).
#
# TODO(supply-chain): pin every image below by @sha256 digest and verify the
# floating tags (litellm/minio/casdoor) against a known-good release.

x-app-env: &app-env
  env_file: [.env.production]

services:
  # ------------------------- backing services ---------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aisat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-aisat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-aisat} -d $${POSTGRES_DB:-aisat}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ['-js', '-sd', '/data', '-m', '8222'] # JetStream on, monitoring on :8222
    volumes:
      - natsdata:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 10s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/6333" || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env.production}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env.production}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  casdoor:
    # Auth provider (kernel Auth = casdoor.Auth). First run needs configuration —
    # see https://casdoor.org. Not gated as a startup dependency of the app tier.
    image: casbin/casdoor:v1.811.0
    restart: unless-stopped
    <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  llm-gateway:
    # Standalone OpenAI-wire gateway (LiteLLM). ONLY holder of provider keys.
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    <<: *app-env
    command: ['--config', '/app/config.yaml', '--port', '4000']
    volumes:
      - ./llm-gateway/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ['CMD-SHELL', "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  # ------------------------- Go BFF (one image, 3 roles) ----------------------
  go-api:
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-backend-go:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck: # distroless: probe via the binary's own subcommand
      test: ['CMD', '/api', 'healthcheck']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 5

  go-relay:
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-backend-go:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: *app-env
    entrypoint: ['/relay']
    depends_on:
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }

  go-worker:
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-backend-go:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: *app-env
    entrypoint: ['/worker']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }

  # ------------------------- Python ML / agent tier ---------------------------
  py-api:
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-backend-python:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: *app-env
    depends_on:
      nats: { condition: service_healthy }
      llm-gateway: { condition: service_healthy }

  py-worker:
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-backend-python:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: *app-env
    command: ['python', '-m', 'src.worker']
    depends_on:
      nats: { condition: service_healthy }
      llm-gateway: { condition: service_healthy }

  py-mcp:
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-backend-python:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: *app-env
    command: ['python', '-m', 'src.mcp_server.server']
    depends_on:
      nats: { condition: service_healthy }

  # Thin crawl orchestrator: consumes ingestion.crawl.<ws> and drives crawl4ai inside
  # a tmpl-crawl sandbox over the Sandbox port. Runs from the backend-python image
  # (no bespoke -crawl image) — the headless browser lives in sandbox-crawl below,
  # not in this container.
  crawl:
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-backend-python:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: *app-env
    command: ['python', '-m', 'src.services.ingestion.crawl_orchestrator']
    depends_on:
      nats: { condition: service_healthy }
      sandbox-crawl: { condition: service_started }

  # ------------------------- sandbox tier (SANDBOX_KIND=service) --------------
  # NO DOCKER SOCKET IS MOUNTED ANYWHERE IN THIS FILE — that is the point of the
  # `service` kind. On compose, per-job isolation would require creating containers
  # at runtime, which means handing some component /var/run/docker.sock: HOST-
  # EQUIVALENT privilege (and :ro does NOT restrict the API — read-only applies to
  # the socket file, not the endpoint). Paying an UNBOUNDED control-plane risk to
  # close a BOUNDED tenant-persistence risk is a bad trade at MVP volume. So these
  # run as long-lived pools reached over HTTP, and nothing creates anything.
  #
  # On EKS the calculus inverts — per-job costs only an RBAC-scoped ServiceAccount —
  # so SANDBOX_KIND=k8s_pod runs these per job and regains the hard workspace
  # recycle boundary. Same images, same Sandbox port, callers unchanged.
  #
  # THE DELTA YOU ARE ACCEPTING HERE (contract invariant 12): these pools are
  # STATELESS PER JOB but the workspace boundary is SOFT. Fresh state per job kills
  # DATA carryover; it does NOT evict an attacker already resident in the process.
  # That is bounded by recycle (max_runs + TTL), not eliminated. tmpl-coderun is
  # therefore NEVER served from a service pool.
  sandbox-crawl:
    # tmpl-crawl as a warm browser pool. Per job: a fresh browser.newContext()
    # (new cookie jar / localStorage / cache), and the browser PROCESS is recycled
    # every max_runs jobs — which browsers need anyway for memory, and which is what
    # bounds compromise persistence. Egress: SSRF allowlist only, via the proxy.
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-sandbox-crawl:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # DELIBERATELY *NOT* `<<: *app-env` — that would inject .env.production wholesale,
    # handing this sandbox OPENAI_API_KEY, ANTHROPIC_API_KEY, DATABASE_URL, JWT_SECRET
    # and every other secret. That is a direct violation of contract invariant 1
    # ("a sandbox gets NO provider API keys, NO DB/Redis/Qdrant connection"). Sandboxes
    # get an explicit, minimal env and nothing else — enumerate, never inherit.
    environment:
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:?set}   # verifies INBOUND calls; not a provider key
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runc}
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=256m']
    pids_limit: 256              # Chromium is multi-process; a mem cap alone is not a cap
    mem_limit: 2g
    cpus: 1.0

  sandbox-convert:
    # tmpl-convert as a pool. Per job: a FRESH SUBPROCESS with its own rlimits plus a
    # fresh temp dir — so a parser RCE lands in a short-lived child that dies with the
    # job, inside an already non-root/read-only/caps-dropped container. Plus a TTL
    # restart, because subprocess death is not the same as container death.
    # This is the template that wants runsc (SANDBOX_RUNTIME_TMPL_CONVERT) — untrusted
    # user files through parsers that have no internal sandbox of their own.
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-sandbox-convert:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # NOT `<<: *app-env` — see the note on sandbox-crawl. Invariant 1: no ambient creds.
    environment:
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:?set}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME_TMPL_CONVERT:-runsc}
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=256m']
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    network_mode: none           # conversion is fully offline — no route at all

  # ---- tmpl-coderun: SANDBOX_KIND=oneshot (Phase 2) --------------------------
  # NOT a `service` pool. Model-authored code must never touch a reused instance,
  # so each replica: starts -> pulls EXACTLY ONE job from the NATS queue group ->
  # runs it -> EXITS. Docker's restart policy recreates it with a fresh tmpfs over
  # immutable image layers. That is REAL destruction, with no runtime socket.
  # Scale concurrency with replicas:  docker compose up -d --scale sandbox-coderun=N
  #
  # THREE OBLIGATIONS, ALL SILENT WHEN BROKEN (contract invariant 12 + `oneshot`):
  #  1. read_only + tmpfs-only. LOAD-BEARING: a restart reuses the same container ID
  #     AND its writable layer, so a writable rootfs lets a dropped file survive the
  #     restart — silently rebuilding the reuse this design exists to prevent.
  #  2. The process MUST EXIT after one job. A `while True` around the handler is the
  #     failure mode wearing the fix's clothes.
  #  3. The model-authored code must NOT inherit this container's NATS route. PID 1 is
  #     a thin supervisor holding the connection; it forks the untrusted code into a
  #     child with NO network namespace. This is oneshot's weakest point vs k8s_pod,
  #     where the job arrives via the API server and the sandbox needs no bus route.
  #
  # Restart backoff is fine HERE because coderun is rare + HITL-gated: a replica idles
  # far longer than it runs, so uptime keeps resetting the backoff counter. A
  # high-rate template under `oneshot` would thrash — hence this kind is code-gen only.
  #
  # Phase 2. Enable with:  docker compose --profile coderun up -d
  sandbox-coderun:
    profiles: [coderun]
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-sandbox-coderun:${IMAGE_TAG:-latest}
    restart: always              # the recreate mechanism — NOT `unless-stopped`
    runtime: ${SANDBOX_OCI_RUNTIME:-runsc}   # gVisor; set to `runc` where runsc is absent
    # NOT `<<: *app-env` — invariant 1. Enumerate, never inherit.
    environment:
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:?set}
      SANDBOX_KIND: oneshot
      SANDBOX_MAX_RUNS: "1"      # non-negotiable: one job, then exit
      NATS_URL: ${NATS_URL:-nats://nats:4222}   # held by the SUPERVISOR only (obligation 3)
    user: "65534:65534"
    read_only: true              # obligation 1 — do not remove
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=256m']   # the ONLY writable path
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      nats: { condition: service_healthy }

  # ------------------------- LLM observability: Langfuse ----------------------
  # LLM tracing/eval for the agent tiers — part of the app stack, NOT the
  # optional monitoring overlay (the app tiers send traces here). Runs with its
  # OWN Postgres (decoupled from the app DB). App wiring is via
  # LANGFUSE_HOST/PUBLIC_KEY/SECRET_KEY. The UI binds to 127.0.0.1 only — reach it
  # over an SSH tunnel, or front it with Caddy on a subdomain.
  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?set in .env.production}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U langfuse -d langfuse']
      interval: 10s
      timeout: 3s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?set in .env.production}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env.production}
      SALT: ${LANGFUSE_SALT:?set in .env.production}
      TELEMETRY_ENABLED: 'false'
      LANGFUSE_DEFAULT_PROJECT_ROLE: VIEWER
      # Optional headless bootstrap — uncomment to pre-seed an org/project and a
      # key pair so the app's LANGFUSE_PUBLIC_KEY/SECRET_KEY work on first boot:
      # LANGFUSE_INIT_ORG_ID: aisat
      # LANGFUSE_INIT_PROJECT_ID: aisat
      # LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      # LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      # LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      # LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    ports:
      - '127.0.0.1:3001:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/public/health']
      interval: 30s
      timeout: 5s
      retries: 10

  # ------------------------- edge: Caddy = TLS + proxy + SPA ------------------
  # Per plan.md, Caddy does static SPA serving AND reverse proxy AND automatic TLS.
  # The image built from frontend/ is Caddy with the built SPA baked in at /srv, so
  # there is NO separate nginx/static container. The Caddyfile is mounted (editable
  # without a rebuild); the SPA assets ship inside the image (deploy together by tag).
  caddy:
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [go-api, go-relay]
    ports:
      - '80:80'
      - '443:443'
    environment:
      PRODUCTION_HOST: ${PRODUCTION_HOST:?set in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck: # Caddy admin API (localhost:2019) confirms the server is up
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']
      interval: 20s
      timeout: 3s
      retries: 5

  # ------------------------- one-shot migration role --------------------------
  # `docker compose --profile migrate run --rm migrate` (invoked by deploy.sh).
  migrate:
    image: ${REGISTRY:-docker.io}/${DOCKERHUB_USERNAME:?set}/${IMAGE_PREFIX:-aisat}-backend-go:${IMAGE_TAG:-latest}
    <<: *app-env
    entrypoint: ['/api']
    command: ['migrate', 'up'] # binary must expose a `migrate up` subcommand
    restart: 'no'
    profiles: ['migrate']
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  natsdata:
  qdrantdata:
  miniodata:
  langfuse_pgdata:
  caddy_data:
  caddy_config:
