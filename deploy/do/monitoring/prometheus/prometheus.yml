# Prometheus scrape + alerting config for the droplet stack.
# Targets are compose service names on the shared network (see the overlay).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: aisat-do
    env: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter # host CPU / memory / disk / network
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor # per-container CPU / memory / net / fs
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  # --- Application tiers ------------------------------------------------------
  # Enabled ahead of the app exposing metrics: the targets simply read as "down"
  # until the Go/Python services serve Prometheus text at /metrics. Adjust ports
  # or split into per-service jobs as the runtimes land.
  - job_name: aisat-apps
    metrics_path: /metrics
    static_configs:
      - targets: ['go-api:8080']
        labels: { tier: bff, runtime: go }
      - targets: ['py-api:8000']
        labels: { tier: ml, runtime: python }

  # NATS exposes JSON monitoring (not Prometheus) on :8222. To scrape it, add a
  # prometheus-nats-exporter sidecar and point a job at exporter:7777 instead.
  # - job_name: nats
  #   static_configs:
  #     - targets: ['nats-exporter:7777']
