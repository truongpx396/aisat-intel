# Load every dashboard JSON dropped into /var/lib/grafana/dashboards.
# Drop community dashboards there too (see monitoring/README.md for IDs).
apiVersion: 1

providers:
  - name: aisat
    orgId: 1
    folder: AISAT
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
