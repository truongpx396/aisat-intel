# ---------------------------------------------------------------------------
# Local development infra stack (T005). Brings up every BACKING SERVICE the
# three app runtimes (backend-go, backend-python, frontend) need, so they can
# be run natively on the host via `make dev` (T007) against real Postgres /
# Redis / Qdrant / NATS / MinIO / Casdoor / the LLM gateway, fronted by Caddy.
# Matches specs/001-contextengine-mvp/quickstart.md's "Bring up the stack".
#
# This is DEV-ONLY. The production stack is a separate, already-built file at
# deploy/do/docker-compose.prod.yml — do not confuse the two, and do not port
# changes from one to the other without checking both are still correct.
# Image tags below are chosen to MATCH deploy/do/docker-compose.prod.yml
# exactly, so dev and prod run the identical backing-service versions.
#
# App services (go-api/go-relay/go-worker/py-api/py-worker/py-mcp/crawl/
# sandbox-*) do NOT exist in this file — they land with the application code
# in later stages. See deploy/Caddyfile (T006) for the corresponding
# bootstrap-stage note on its still-unresolvable upstreams.
#
# Credentials: every credential-shaped value below is an env-var placeholder
# with a documented DEV-ONLY fallback (`${VAR:-dev-default}`) — never a bare
# literal. Override by copying deploy/.env.example to deploy/.env (gitignored
# by the repo's root .gitignore) — see that file for the full list. These
# fallbacks are intentionally well-known/weak; never reuse them past a
# throwaway local stack.
#
# All published ports are bound to 127.0.0.1 only — this stack is for a
# developer's own machine, not for exposing backing services to a LAN/Wi-Fi.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aisat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-postgres-pw}
      POSTGRES_DB: ${POSTGRES_DB:-aisat}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-aisat} -d $${POSTGRES_DB:-aisat}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:6333:6333' # REST
      - '127.0.0.1:6334:6334' # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl/wget, so a plain TCP reachability check
      # against the REST port stands in for its /readyz endpoint — the same
      # approach already used for this image in deploy/do/docker-compose.prod.yml.
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/6333" || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ['-js', '-sd', '/data', '-m', '8222'] # JetStream on, monitoring on :8222
    ports:
      - '127.0.0.1:4222:4222'
      - '127.0.0.1:8222:8222'
    volumes:
      - natsdata:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
    ports:
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  casdoor:
    # Auth provider behind the kernel Auth interface (T017). Configured
    # entirely via environment — no mounted app.conf. Casdoor's own tables
    # live in the shared ${POSTGRES_DB} database for Stage-1 bootstrap
    # simplicity: the official postgres image only auto-creates the ONE
    # database named by POSTGRES_DB on first init, so giving Casdoor a
    # separate database would need a docker-entrypoint-initdb.d init script —
    # out of scope for this file's exact task list (T005). Revisit dedicated
    # DB/schema isolation if it becomes a real concern once T017 lands.
    image: casbin/casdoor:v1.811.0
    restart: unless-stopped
    environment:
      RUNNING_IN_DOCKER: 'true'
      driverName: postgres
      dataSourceName: 'user=${POSTGRES_USER:-aisat} password=${POSTGRES_PASSWORD:-dev-only-postgres-pw} host=postgres port=5432 sslmode=disable dbname=${POSTGRES_DB:-aisat}'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Container's default port is 8000; published on HOST port 8001 instead
      # — `make dev` (T007) reserves host :8000 for backend-python's uvicorn
      # (see quickstart.md), so this avoids a host-port collision. Other
      # containers still reach Casdoor internally at casdoor:8000.
      - '127.0.0.1:8001:8000'
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/8000" || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  llm-gateway:
    # Standalone LLM gateway (LiteLLM), the only holder of provider keys.
    # Config is a Stage-1 PLACEHOLDER — see ./llm-gateway/config.yaml. The
    # real alias/provider/fallback/circuit-breaker routing table is populated
    # in T024b, not here.
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ['--config', '/app/config.yaml', '--port', '4000']
    volumes:
      - ./llm-gateway/config.yaml:/app/config.yaml:ro
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      test: ['CMD-SHELL', "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    # Reverse proxy for local dev (T006). Fronts the Go BFF + serves the SPA
    # once those exist — see deploy/Caddyfile's bootstrap-stage note. No
    # depends_on against the services above: Caddy never talks to
    # postgres/redis/qdrant/nats/minio/casdoor/llm-gateway directly, only to
    # the not-yet-existing go-api/go-relay/SPA build, so there is nothing in
    # THIS file for it to depend on yet.
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']
      interval: 20s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  natsdata:
  miniodata:
  caddy_data:
  caddy_config:
