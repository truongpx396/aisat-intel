# Kind cluster tuned for the aisat chart: one node, labelled ingress-ready so
# ingress-nginx schedules on it, with host ports 80/443 published so the Ingress
# is reachable at http://<host>.localtest.me from your machine.
# Cluster name is set by up.sh via `kind create cluster --name` (default: aisat).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
