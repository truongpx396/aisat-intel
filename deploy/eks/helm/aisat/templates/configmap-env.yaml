{{- /* Non-secret env shared by every app/backing pod (envFrom). */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aisat.configName" . }}
  labels:
    {{- include "aisat.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
