{{- /* External Secrets Operator integration (production path). Pulls a JSON secret
       from AWS Secrets Manager and materializes it as the `<fullname>-secrets`
       Secret the app pods read. Requires the operator + a (Cluster)SecretStore.
       See deploy/eks/SETUP.md. */ -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "aisat.fullname" . }}-secrets
  labels:
    {{- include "aisat.labels" . | nindent 4 }}
  annotations:
    # ESO materializes the target Secret at wave -2; Argo CD waits for this to be
    # Ready before the migrate hook (wave -1) runs. Requires ESO + a SecretStore.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "aisat.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.remoteKey }}
{{- end }}
