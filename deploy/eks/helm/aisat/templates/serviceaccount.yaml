{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aisat.serviceAccountName" . }}
  labels:
    {{- include "aisat.labels" . | nindent 4 }}
  annotations:
    # Created before the migrate hook (wave -1), which runs as this SA (Argo CD).
    argocd.argoproj.io/sync-wave: "-2"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
