{{- /* Chart-managed Secret (bootstrap/dev only). Rendered ONLY when secrets.create
       is true and neither an existingSecret nor External Secrets is in use. For
       production, prefer externalSecrets.enabled or a pre-created existingSecret;
       never commit real values here — override at deploy time. */ -}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aisat.secretName" . }}
  labels:
    {{- include "aisat.labels" . | nindent 4 }}
  annotations:
    # Present before the migrate hook (wave -1) reads it via envFrom (Argo CD).
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
