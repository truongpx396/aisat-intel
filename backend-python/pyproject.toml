[project]
name = "aisat-intel-backend-python"
version = "0.1.0"
description = "AISAT-INTEL Python ML/agent tier: FastAPI routes, LangGraph RAG agent, ingestion pipeline, and MCP tool server."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "langgraph>=0.2",
  "mem0ai>=0.1",
  "baml-py>=0.60",
  "fastmcp>=0.4",
  "qdrant-client>=1.12",
  "openai>=1.50",
  "structlog>=24.1",
  "langfuse>=2.50",
  "docker>=7.1",
]

[project.optional-dependencies]
# Sandbox port backends beyond the `docker` base dependency above (research §24).
# Only the backend actually deployed in a given environment needs installing:
# `docker` = local macOS dev + first DO-droplet compose deploy (base dependency,
# declared above); `k8s` = the k8s_pod backend once k3s/EKS lands; `e2b` = the
# Phase-2 microVM backend. The `Sandbox` port keeps all three behind one interface.
k8s = ["kubernetes>=30.1"]
e2b = ["e2b>=1.0"]
# Build the sandbox templates (deploy/sandbox/templates/tmpl-convert, tmpl-crawl),
# not the base backend-python image (research §24).
convert = ["markitdown>=0.0.1a3"]
crawl = ["crawl4ai>=0.4", "playwright>=1.47"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "testcontainers>=4.8",
  "ruff>=0.7",
  "black>=24.10",
]

[tool.uv]
# `src/` is still an empty Stage-1 placeholder (see src/.gitkeep) — there is no
# installable package yet, so this project is managed as a dependency-only
# ("virtual") uv project rather than a build target. Revisit once a real
# `src/<package>/` lands (T028+).
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: marks tests that spin up real backing services via testcontainers (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
