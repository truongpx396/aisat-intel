# CI gate — lint, test, and security-scan every PR and every push to main.
#
# Runtime jobs are PRESENCE- and CHANGE-guarded (dorny/paths-filter): a job only
# runs when that runtime's code exists AND changed, so this pipeline is inert on a
# specs-only repo and "lights up" per runtime (Go / Python / React) as code lands.
#
# NOTE: actions are pinned to major version tags for readability. Per
# .github/instructions/devops-cicd.instructions.md they SHOULD be pinned to full
# commit SHAs before production — use `ratchet`/`pin-github-action` or Dependabot
# (see .github/dependabot.yml, which is configured to manage these pins).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Which runtimes changed? (dir absent => filter is false => downstream skips)
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      terraform: ${{ steps.filter.outputs.terraform }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - 'backend-go/**/*.go'
              - 'backend-go/go.mod'
              - 'backend-go/go.sum'
            python:
              - 'backend-python/**/*.py'
              - 'backend-python/pyproject.toml'
              - 'backend-python/uv.lock'
            frontend:
              - 'frontend/**/*.[jt]s'
              - 'frontend/**/*.[jt]sx'
              - 'frontend/**/*.css'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/package-lock.json'
            docker:
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - 'deploy/**'
            terraform:
              - '**/*.tf'
              - '**/*.tftpl'
              - '**/.tflint.hcl'
              - '**/.trivyignore'
              - '.github/workflows/ci.yml'
            helm:
              - 'deploy/eks/helm/**'
              - '.github/workflows/cd-eks.yml'

  # ---------------------------------------------------------------------------
  # Secret scanning — always runs (cheap, catches leaked creds in any change).
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  # ---------------------------------------------------------------------------
  # Go BFF / gateway / kernel  (backend-go)
  # ---------------------------------------------------------------------------
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend-go/go.sum
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend-go
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build all entrypoints
        run: |
          for c in api relay worker; do
            [ -d "./cmd/$c" ] && go build -o /dev/null "./cmd/$c" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: backend-go/coverage.out
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Python ML / agent tier  (backend-python, UV)
  # ---------------------------------------------------------------------------
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend-python/uv.lock
      - name: Install (frozen)
        run: uv sync --frozen --all-extras --dev
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check (mypy, non-blocking until typed)
        run: uv run mypy src || echo "::warning::mypy reported issues"
      - name: Test (coverage)
        run: uv run pytest --cov=src --cov-report=xml
      - name: Dependency audit (pip-audit)
        run: uvx pip-audit || echo "::warning::pip-audit reported advisories"

  # ---------------------------------------------------------------------------
  # React 19 + Vite SPA  (frontend)
  # ---------------------------------------------------------------------------
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install; fi
      - name: Lint
        run: npm run lint --if-present
      - name: Type-check
        run: npm run typecheck --if-present
      - name: Test
        run: npm run test --if-present
      - name: Build
        run: npm run build --if-present
      - name: Dependency audit
        run: npm audit --omit=dev || echo "::warning::npm audit reported advisories"

  # ---------------------------------------------------------------------------
  # Dockerfile lint + IaC/config scan  (any Docker or deploy change)
  # ---------------------------------------------------------------------------
  docker-lint:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint all Dockerfiles
        run: |
          shopt -s globstar nullglob
          files=(**/Dockerfile **/Dockerfile.*)
          [ ${#files[@]} -eq 0 ] && { echo "no Dockerfiles"; exit 0; }
          for f in "${files[@]}"; do
            echo "== $f =="
            docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < "$f"
          done
      - name: Trivy config / IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0' # report-only for now; flip to '1' to block (see SETUP.md)

  # ---------------------------------------------------------------------------
  # Terraform — per root (DigitalOcean: deploy/do/terraform; AWS EKS:
  # deploy/eks/terraform). Advisory: fmt. Blocking: validate, TFLint (lint +
  # provider rules), Trivy config scan (HIGH/CRITICAL misconfigurations).
  # ---------------------------------------------------------------------------
  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [deploy/do/terraform, deploy/eks/terraform]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Format check (advisory)
        run: terraform fmt -check -recursive -diff || echo "::warning::terraform fmt would reformat files in ${{ matrix.dir }} — run 'terraform fmt -recursive'"
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate -no-color

      # Lint — provider-aware checks validate can't do (deprecated syntax,
      # invalid instance types, unused declarations). Config: <dir>/.tflint.hcl.
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1
      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # avoids plugin-download rate limits
        run: |
          tflint --init
          tflint --format compact

      # Security/compliance scan of the HCL source (no plan / no creds needed).
      # We scan our own code, not vendored upstream modules `terraform init`
      # pulled into .terraform/: skip-dirs drops their standalone files (e.g.
      # example k8s manifests) and TRIVY_TF_EXCLUDE_DOWNLOADED_MODULES drops
      # findings the terraform scanner attributes to those modules' resources.
      # Blocks only on HIGH,CRITICAL; accept checks in a per-root .trivyignore.
      - name: Trivy config scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_TF_EXCLUDE_DOWNLOADED_MODULES: 'true'
        with:
          scan-type: config
          scan-ref: ${{ matrix.dir }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: '.terraform,**/.terraform'
          trivyignores: ${{ matrix.dir }}/.trivyignore

  # ---------------------------------------------------------------------------
  # Helm chart (deploy/eks/helm) — lint, render both overlays, schema-validate.
  # ---------------------------------------------------------------------------
  helm-lint:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - name: Helm lint
        run: helm lint deploy/eks/helm/aisat
      - name: Render (default + production overlays)
        run: |
          set -euo pipefail
          reg=000000000000.dkr.ecr.us-east-1.amazonaws.com
          helm template aisat deploy/eks/helm/aisat --namespace aisat \
            --set image.registry="$reg" --set image.tag=citest > /tmp/rendered.yaml
          helm template aisat deploy/eks/helm/aisat --namespace aisat \
            -f deploy/eks/helm/aisat/values-production.yaml \
            --set image.registry="$reg" --set image.tag=citest \
            --set ingress.host=ci.example.com \
            --set ingress.certificateArn=arn:aws:acm:us-east-1:000000000000:certificate/ci > /dev/null
          echo "default overlay rendered $(grep -c '^kind:' /tmp/rendered.yaml) resources"
      - name: Validate manifests (kubeconform)
        run: |
          set -euo pipefail
          curl -sSLf https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform
          /tmp/kubeconform -strict -ignore-missing-schemas -summary /tmp/rendered.yaml

  # ---------------------------------------------------------------------------
  # Aggregate gate — a single required check for branch protection.
  # Passes only if no needed job failed (skipped is OK on a specs-only change).
  # ---------------------------------------------------------------------------
  ci-gate:
    if: always()
    needs: [secret-scan, go, python, frontend, docker-lint, terraform, helm-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required CI job did not pass"; exit 1
            fi
          done
          echo "CI gate passed."
