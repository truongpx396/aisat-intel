# CD (EKS) — build images, push to Amazon ECR, then deploy to AWS EKS via Helm.
#
# Runs ALONGSIDE cd.yml (the DigitalOcean droplet pipeline); it does not replace
# it. To keep from double-deploying on every push, this workflow is opt-in:
#   - workflow_dispatch : manual promote/redeploy/rollback (pass an image_tag)
#   - push: tags 'v*'   : deploy on a release tag
# To make EKS deploy automatically on main too, add `push: { branches: [main] }`.
#
# Flow:  discover present images -> build+push to ECR (matrix) -> [approval gate]
#        -> write image tag to values-image.yaml + git push -> Argo CD auto-syncs
#
# GitOps: Argo CD (deploy/eks/argocd/apps/aisat-app.yaml) owns the release. This
# workflow no longer runs `helm upgrade`; it commits the new tag and Argo CD rolls
# it out (migrations run as an Argo Sync hook). The production-eks approval gate
# still applies — it now gates the tag-bump commit.
#
# Auth: build assumes the OIDC deploy role for ECR (Terraform output
# `github_deploy_role_arn`) — NO long-lived AWS keys. The promote job needs no
# AWS access, only permission to push the tag commit.
#
# See .github/workflows/ci.yml for the note on pinning actions to commit SHAs.
name: CD (EKS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to (re)deploy — defaults to this commit SHA'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # OIDC token to assume the AWS deploy role

concurrency:
  group: cd-eks-${{ github.ref }}
  cancel-in-progress: false # never cancel a build/deploy that is mid-flight

env:
  IMAGE_PREFIX: aisat
  # Namespace the app is released into. Override with an Actions variable if set.
  EKS_NAMESPACE: ${{ vars.EKS_NAMESPACE || 'aisat' }}
  HELM_RELEASE: aisat

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — fail early and loud if the AWS/ECR wiring isn't configured.
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required Actions variables
        run: |
          missing=()
          for v in AWS_REGION AWS_DEPLOY_ROLE_ARN EKS_CLUSTER_NAME ECR_REGISTRY; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions Variables: ${missing[*]} — see deploy/eks/SETUP.md (from 'terraform output')."
            exit 1
          fi
          echo "AWS wiring present."
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

  # ---------------------------------------------------------------------------
  # Build a dynamic matrix of the component images that actually exist yet.
  # (Mirrors cd.yml so the EKS path stays inert until real source lands.)
  # ---------------------------------------------------------------------------
  discover:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      any: ${{ steps.set.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - id: set
        run: |
          items=()
          add() { items+=("$1"); }
          if [ -f backend-go/Dockerfile ] && [ -f backend-go/go.mod ]; then
            add '{"name":"backend-go","context":"backend-go","dockerfile":"backend-go/Dockerfile"}'
          fi
          if [ -f backend-python/Dockerfile ] && [ -f backend-python/pyproject.toml ]; then
            add '{"name":"backend-python","context":"backend-python","dockerfile":"backend-python/Dockerfile"}'
          fi
          # No crawl image: the crawl role runs from the backend-python image as a thin
          # orchestrator; its crawl4ai toolchain ships as an E2B microVM template
          # (deploy/sandbox/templates/tmpl-crawl.Dockerfile), built by the sandbox step.
          if [ -f frontend/Dockerfile ] && [ -f frontend/package.json ]; then
            add '{"name":"frontend","context":"frontend","dockerfile":"frontend/Dockerfile"}'
          fi
          if [ ${#items[@]} -eq 0 ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'any=false' >> "$GITHUB_OUTPUT"
            echo "::notice::No buildable Dockerfiles yet — nothing to build or deploy."
          else
            printf -v joined '%s,' "${items[@]}"; joined="${joined%,}"
            echo "matrix={\"include\":[$joined]}" >> "$GITHUB_OUTPUT"
            echo 'any=true' >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build + push each image once to ECR. Tag by git SHA (immutable) + latest/semver.
  # ---------------------------------------------------------------------------
  build:
    needs: [preflight, discover]
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=eks-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=eks-${{ matrix.name }}
          provenance: true
          sbom: true

      - name: Scan pushed image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-eks-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0' # report-only; see deploy/eks/SETUP.md to make image CVEs blocking

      - name: Upload scan (SARIF)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-eks-${{ matrix.name }}
          path: trivy-eks-${{ matrix.name }}.sarif
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Promote via GitOps: write the built image tag into values-image.yaml and push
  # it. Argo CD (aisat-app Application) then auto-syncs the new version — no
  # cluster/AWS access here. The protected `production-eks` environment still
  # gates this step, so approval is required before the tag is committed.
  #
  # Pushing to the GitOps branch (default: main) needs a token that can bypass
  # branch protection. GITHUB_TOKEN works if the branch is unprotected or allows
  # the actions bot; otherwise set a GITOPS_TOKEN secret (PAT / GitHub App) and/or
  # a GITOPS_BRANCH variable pointing at a dedicated deploy branch Argo tracks.
  # ---------------------------------------------------------------------------
  promote:
    needs: [discover, build]
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the tag-bump commit
    environment:
      name: production-eks
      url: https://${{ vars.PRODUCTION_HOST }}
    concurrency:
      group: promote-eks-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ vars.GITOPS_BRANCH || 'main' }} # the branch Argo CD tracks
          fetch-depth: 0
          token: ${{ secrets.GITOPS_TOKEN || github.token }}

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ github.event.inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Notify — promote started
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            🚀 EKS promote STARTED — aisat-intel
            env: production-eks (GitOps)
            ref: ${{ github.ref_name }}
            tag: ${{ steps.tag.outputs.value }}
            by:  ${{ github.actor }}
            run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Write image tag into values-image.yaml
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          f=deploy/eks/helm/aisat/values-image.yaml
          # Regenerate the whole file (it exists only to carry the tag) — portable,
          # no dependence on sed dialect or the file's prior contents.
          cat > "$f" <<YAML
          # CI-MANAGED — do not edit by hand. Rewritten by .github/workflows/cd-eks.yml
          # after build+push, behind the production-eks gate. The commit is what
          # triggers Argo CD to sync the new version.
          image:
            tag: "${TAG}"
          YAML
          echo "values-image.yaml now:"; cat "$f"

      - name: Commit + push (triggers Argo CD sync)
        id: commit
        env:
          TAG: ${{ steps.tag.outputs.value }}
          BRANCH: ${{ vars.GITOPS_BRANCH || 'main' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/eks/helm/aisat/values-image.yaml
          if git diff --cached --quiet; then
            echo "Image tag already ${TAG}; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "deploy(eks): aisat image tag ${TAG} [skip ci]"
          git push origin "HEAD:${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify — promote succeeded
        if: success()
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ✅ EKS promote SUCCEEDED — aisat-intel
            env: production-eks  •  tag: ${{ steps.tag.outputs.value }}
            ${{ steps.commit.outputs.changed == 'true' && 'Tag committed — Argo CD is syncing the release.' || 'No tag change — already at this version.' }}
            Watch: Argo CD UI (aisat-app)  •  url: https://${{ vars.PRODUCTION_HOST }}

      - name: Notify — promote failed
        if: failure()
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ❌ EKS promote FAILED — aisat-intel
            env: production-eks  •  tag: ${{ steps.tag.outputs.value }}
            The tag was NOT committed (push/permission error?). Argo CD still runs
            the previous version. See deploy/eks/SETUP.md (GitOps token/branch).
            run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
